name: ci

# PR:   check + security → merge-on-green (if labelled `automerge`)
# main: check + security → deploy (assets built here, published on deploy-production)
# Standards: https://github.com/ki4hrg/standards/blob/main/docs/profiles/laravel-app.md
#
# No image or Dockhand jobs: Laravel apps deploy to RunCloud, which pulls the
# deploy branch. A repo in migration Phase 1 leaves `deploy` out until Phase 2,
# while RunCloud still deploys main.

on:
  push:
    branches: [main]
    # A docs-only direct push doesn't re-run checks. PRs always run (merge-on-green).
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    # `labeled`: adding `automerge` to a PR whose checks already ran starts the merge.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # merge-on-green dispatches this after merging (a merge by GITHUB_TOKEN raises no
  # push event). Also: re-run by hand from the Actions tab.
  workflow_dispatch:

# Superseded runs are cancelled on a PR, never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ki4hrg/standards/.github/workflows/php-check.yml@v1
    with:
      php-version: '8.4'             # match config.platform.php in composer.json
      database-image: mysql:8.4      # match production's engine and major
      scripts: check                 # composer scripts: Pint --test, Larastan, Pest

  security:
    uses: ki4hrg/standards/.github/workflows/security.yml@v1
    with:
      package-managers: composer npm

  automerge:
    needs: [check, security]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write   # dispatches this workflow on main after merging
      checks: read     # waits for app checks (GitGuardian); private repos need it
    uses: ki4hrg/standards/.github/workflows/merge-on-green.yml@v1

  # GitHub doesn't close "Closes #n" issues when GITHUB_TOKEN merges, so this does.
  close-issues:
    needs: automerge
    if: needs.automerge.outputs.merged == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ki4hrg/standards/.github/workflows/close-linked-issues.yml@v1

  # Merging to main is the release (docs/decisions.md). Set the APP_HEALTH_URL
  # variable so this waits for the new revision to be serving.
  deploy:
    needs: [check, security]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # pushes the deploy branch
    uses: ki4hrg/standards/.github/workflows/runcloud-deploy.yml@v1
