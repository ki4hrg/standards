version: 2
# Monthly: every merge runs CI and a deploy, and Actions minutes are short. A public repo
# (free minutes) may use weekly. Security updates don't wait for the schedule: they open
# when an advisory lands, grouped into one PR per ecosystem (the `security` groups).
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    # PR title becomes "chore(deps): …", which merge-on-green's title check accepts.
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors change runtime behaviour; each is planned (migration Phase 6).
      - dependency-name: laravel/framework
        update-types: [version-update:semver-major]
      - dependency-name: livewire/livewire
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework and build-tool majors are planned with the app (migration Phase 6).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: "@tailwindcss/*"
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: laravel-vite-plugin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    # Action updates are low-risk and arrive together, majors included: one PR for all.
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        update-types: [major, minor, patch]
    ignore:
      # The standards' reusable workflows: a new major (v2) is breaking by definition and
      # is adopted as planned work, never inside a routine grouped PR.
      - dependency-name: "ki4hrg/standards*"
        update-types: [version-update:semver-major]
