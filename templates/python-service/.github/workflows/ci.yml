name: ci

# PR: check + security → image (build only) → merge-on-green (if labelled `automerge`)
# main: check + security → image (build + push to GHCR) → deploy (Dockhand webhook)
# For deploy mode B (service in another stack), drop `deploy` and publish on
# version tags instead: standards docs/core/deploy.md.

on:
  push:
    branches: [main]
    # A docs-only direct push doesn't rebuild or redeploy. PRs always run (merge-on-green).
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # merge-on-green dispatches this after merging; also a manual redeploy.
  workflow_dispatch:

# Superseded runs are cancelled on a PR, never on main. On main a running build always
# finishes; a queued one can still be replaced by a newer commit's run (GitHub keeps one
# pending run per group), which includes it, so not every main commit gets its own image.
# A label other than `automerge` gets its own group, so its (skipped) run never cancels
# the real one: Dependabot adds labels as it opens a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'automerge' && '-other-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Only `automerge` among labels starts a run; every job below needs this one.
    if: github.event.action != 'labeled' || github.event.label.name == 'automerge'
    uses: ki4hrg/standards/.github/workflows/python-check.yml@v1

  security:
    # Only `automerge` among labels starts a run; every job below needs this one.
    if: github.event.action != 'labeled' || github.event.label.name == 'automerge'
    uses: ki4hrg/standards/.github/workflows/security.yml@v1
    with:
      package-managers: uv

  image:
    needs: [check, security]
    permissions:
      contents: read
      packages: write
    uses: ki4hrg/standards/.github/workflows/image.yml@v1
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      platforms: linux/amd64

  automerge:
    needs: [check, security, image]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write   # dispatches this workflow on main after merging
      checks: read     # waits for app checks (GitGuardian); private repos need it
    uses: ki4hrg/standards/.github/workflows/merge-on-green.yml@v1
    with:
      # paths-ignore above doesn't apply to the dispatch after a merge; this does.
      skip-dispatch-paths: 'docs/* *.md'

  # GitHub doesn't close "Closes #n" issues when GITHUB_TOKEN merges, so this does.
  close-issues:
    needs: automerge
    if: needs.automerge.outputs.merged == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ki4hrg/standards/.github/workflows/close-linked-issues.yml@v1

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ki4hrg/standards/.github/workflows/dockhand-deploy.yml@v1
    secrets: inherit
