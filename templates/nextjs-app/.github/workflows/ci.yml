name: ci

# PR: check + security → image (build only) → merge-on-green (if labelled `automerge`)
# main: check + security → image (build + push to GHCR) → deploy (Dockhand webhook)
# Standards: https://github.com/ki4hrg/standards/blob/main/docs/core/deploy.md

on:
  push:
    branches: [main]
    # A docs-only direct push (allowed by workflow.md) doesn't rebuild or redeploy.
    # Push only: PRs always run, because merge-on-green needs a green run to merge.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    # `labeled`: adding `automerge` to a PR whose checks already ran starts the merge.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # merge-on-green dispatches this after merging (a merge by GITHUB_TOKEN raises no
  # push event). Also: rebuild and redeploy by hand from the Actions tab.
  workflow_dispatch:

# Superseded runs are cancelled on a PR, never on main, where every commit is an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ki4hrg/standards/.github/workflows/node-check.yml@v1
    with:
      scripts: typecheck lint test db:drift check:contrast

  security:
    uses: ki4hrg/standards/.github/workflows/security.yml@v1
    with:
      package-managers: pnpm

  image:
    needs: [check, security]
    permissions:
      contents: read
      packages: write
    uses: ki4hrg/standards/.github/workflows/image.yml@v1
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # Match the deploy host (docs/DEPLOYMENT.md). For arm64:
      #   platforms: linux/arm64
      #   runs-on: ubuntu-24.04-arm
      platforms: linux/amd64

  automerge:
    needs: [check, security, image]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write   # dispatches this workflow on main after merging
      checks: read     # waits for app checks (GitGuardian); private repos need it
    uses: ki4hrg/standards/.github/workflows/merge-on-green.yml@v1

  # GitHub doesn't close "Closes #n" issues when GITHUB_TOKEN merges, so this does.
  close-issues:
    needs: automerge
    if: needs.automerge.outputs.merged == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ki4hrg/standards/.github/workflows/close-linked-issues.yml@v1

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ki4hrg/standards/.github/workflows/dockhand-deploy.yml@v1
    secrets: inherit
