name: security

# Dependency audit for the project's package manager. Secret scanning is done by
# the GitGuardian GitHub app on every PR (docs/core/security.md). Advisories at `high` or above fail the job. To accept one advisory,
# ignore it in the package manager's own config and record why in
# docs/DECISIONS.md (see docs/core/security.md) — don't lower the level.
#
#   security:
#     uses: ki4hrg/standards/.github/workflows/security.yml@v1
#     with:
#       package-managers: pnpm   # space-separated: pnpm npm composer uv

on:
  workflow_call:
    inputs:
      package-managers:
        description: Space-separated; any of pnpm npm composer uv.
        type: string
        default: pnpm
      working-directory:
        type: string
        default: '.'
      node-version:
        type: string
        default: '24'
      runs-on:
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      # Word match, so `npm` never matches inside `pnpm`.
      - id: pm
        env:
          PMS: ${{ inputs.package-managers }}
        run: |
          for pm in pnpm npm composer uv; do
            case " $PMS " in *" $pm "*) echo "$pm=true" >> "$GITHUB_OUTPUT" ;; esac
          done

      - if: steps.pm.outputs.pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - if: steps.pm.outputs.pnpm || steps.pm.outputs.npm
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      # Audits read the lockfile; no install needed.
      - if: steps.pm.outputs.pnpm
        run: pnpm audit --audit-level=high
      - if: steps.pm.outputs.npm
        run: npm audit --audit-level=high

      - if: steps.pm.outputs.composer
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
      - if: steps.pm.outputs.composer
        run: composer audit --locked --abandoned=report

      - if: steps.pm.outputs.uv
        uses: astral-sh/setup-uv@v7
      - if: steps.pm.outputs.uv
        run: |
          uv export --locked --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
