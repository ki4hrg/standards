name: python-check

# ruff and pytest for a uv project.
#
#   check:
#     uses: ki4hrg/standards/.github/workflows/python-check.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
      runs-on:
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Python version pinned in the project (.python-version / requires-python).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
