name: close-linked-issues

# Close the issues a merged PR names with a closing keyword ("Closes #n").
# GitHub doesn't do this when the merge was made with GITHUB_TOKEN, which is how
# merge-on-green merges. Call it after merge-on-green, only when it merged:
#
#   close-issues:
#     needs: automerge
#     if: needs.automerge.outputs.merged == 'true'
#     permissions: { contents: read, issues: write, pull-requests: read }
#     uses: ki4hrg/standards/.github/workflows/close-linked-issues.yml@v1
#
# A separate workflow because merge-on-green's callers don't grant `issues: write`,
# and a called workflow asking for more than its caller grants fails to start.

on:
  workflow_call:

# No workflow-level `permissions:`. A called workflow may not ask for anything its
# caller's job doesn't grant, and a workflow-level `contents: read` here made callers
# that grant only issues/pull-requests fail to start (startup_failure).

jobs:
  close:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close issues the PR closes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Only issues in this repo: the token can't close issues elsewhere.
          # `repository` here has `owner.login` and `name`, not `nameWithOwner`.
          issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences \
            --jq ".closingIssuesReferences[] | select((.repository.owner.login + \"/\" + .repository.name) == \"$GITHUB_REPOSITORY\") | .number")
          if [ -z "$issues" ]; then
            # Not silent: a same-repo "Closes #n" that resolved to nothing means
            # the issue stays open, so fail and let the watching agent close it.
            if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+'; then
              echo "::error::The PR body has a closing keyword but GitHub lists no closing issue in this repo. Close it by hand."
              exit 1
            fi
            echo "No linked issues."; exit 0
          fi
          for n in $issues; do
            state=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json state -q .state)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed \
                --comment "Closed by #$PR (merged by merge-on-green)."
            else
              echo "#$n already $state."
            fi
          done
