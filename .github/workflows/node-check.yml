name: node-check

# Typecheck, lint and test a Node project. Testcontainers works as-is: Docker is
# present on GitHub's Ubuntu runners.
#
# pnpm is the standard; `package-manager: npm` exists so a repo that hasn't moved to
# pnpm yet (a migration Phase 6 item) can still adopt this check in Phase 1.
#
# A suite that reads a database URL instead of starting Testcontainers sets
# `postgres-image`: a Postgres service starts on a random host port and the URL is
# exported; read the URL, never assume port 5432. Database
# tests must fail, not skip, when they have no database (docs/decisions.md), or
# the check goes green with most of the suite unrun.
#
# In a monorepo whose workspace package is built before typecheck, list that
# build first in `scripts` (e.g. `build:shared typecheck lint test`).
#
#   check:
#     uses: ki4hrg/standards/.github/workflows/node-check.yml@v1

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: '.'
      package-manager:
        description: pnpm or npm.
        type: string
        default: pnpm
      scripts:
        description: package.json scripts to run in order, space-separated. Each must exist in package.json.
        type: string
        default: typecheck lint test
      postgres-image:
        description: >-
          Postgres image to run as a service (e.g. postgres:18-alpine). Empty runs none.
          When set, the URL is exported under each name in `database-url-env`.
        type: string
        default: ''
      database-url-env:
        description: Space-separated variable names that receive the service's URL.
        type: string
        default: TEST_DATABASE_URL DATABASE_URL
      runs-on:
        type: string
        # Pinned rather than ubuntu-latest so an image change never lands unannounced.
        # Bump here, once, after a green run on the new image.
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      # An empty image skips the service.
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        # A random host port, so anything else holding 5432 doesn't collide. The
        # step below exports the port Docker picked. Not yet enough on the
        # self-hosted runner: each job gets a fresh Docker daemon whose first pick
        # is the same port, so two overlapping jobs can still collide (a rerun
        # passes). The fix belongs on the runner (a port range per slot).
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      # Exported only when the service runs, so a suite without one sees no URL.
      - name: Export the database URL
        if: inputs.postgres-image != ''
        env:
          NAMES: ${{ inputs.database-url-env }}
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          for n in $NAMES; do
            echo "$n=postgres://postgres:postgres@127.0.0.1:$PG_PORT/test" >> "$GITHUB_ENV"
          done
          echo "PGPASSWORD=postgres" >> "$GITHUB_ENV"
      - name: Validate package-manager
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in pnpm|npm) ;; *) echo "::error::package-manager must be pnpm or npm, got '$PM'"; exit 1 ;; esac
      # Reads the version from `packageManager` in package.json.
      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      # Both install exactly what the lockfile says and fail if it is out of date.
      - if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
      # npm's default 300s fetch timeout, times its retries, let one stalled download
      # hold a job for ~17 minutes (seen twice on the self-hosted runner, 2026-11-09).
      # 60s fails fast and retries; `http` logs each fetch, so the one that stalls
      # is named.
      - if: inputs.package-manager == 'npm'
        run: npm ci --fetch-timeout=60000 --fetch-retries=4 --loglevel=http
      - name: Run checks
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for s in $SCRIPTS; do
            echo "::group::$PM run $s"
            "$PM" run "$s"
            echo "::endgroup::"
          done
