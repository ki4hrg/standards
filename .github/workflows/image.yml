name: image

# Build the Dockerfile and, when `push` is true, push it to GHCR as :<branch> and
# :sha-<sha>, labelled with org.opencontainers.image.revision. GIT_REVISION is
# passed as a build arg so the app can report what it is running.
#
# The caller must grant `packages: write` to this job.
#
#   image:
#     needs: [check, security]
#     permissions: { contents: read, packages: write }
#     uses: ki4hrg/standards/.github/workflows/image.yml@v1
#     with:
#       push: ${{ github.event_name != 'pull_request' }}
#       platforms: linux/arm64
#       runs-on: ubuntu-24.04-arm

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      image:
        description: Defaults to ghcr.io/<owner>/<repo>, lowercased.
        type: string
        default: ''
      context:
        type: string
        default: '.'
      file:
        type: string
        default: Dockerfile
      platforms:
        description: Match the deploy host. Build arm64 on an arm runner, not under QEMU.
        type: string
        default: linux/amd64
      runs-on:
        type: string
        default: ubuntu-24.04
      build-args:
        description: Extra build args, one KEY=value per line. GIT_REVISION is always set.
        type: string
        default: ''
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR rejects uppercase in a repository path.
      - id: name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"; fi
          echo "value=$IMAGE" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.value }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            ${{ inputs.build-args }}
          cache-from: type=gha
          # The cache is an optimisation and must never fail a good build. Only pushes
          # write it, so PR builds can't evict main's cache.
          cache-to: ${{ inputs.push && 'type=gha,mode=max,ignore-error=true' || '' }}
